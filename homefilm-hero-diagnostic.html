<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HOME FILM 모바일 배너 진단</title><style>body{font:16px/1.6 system-ui,sans-serif;background:#f7f4ef;color:#292722;margin:0;padding:18px}main{max-width:560px;margin:auto}h1{font-size:22px}#photo{width:100%;aspect-ratio:16/9;object-fit:cover;background:#ddd}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:14px;border:1px solid #ddd;font-size:14px}button{padding:12px 20px;font-size:16px}#status{font-weight:bold}</style></head><body><main><h1>HOME FILM 모바일 배너 진단</h1><p>이 페이지는 홈페이지를 수정하지 않습니다. 15초간 열어두세요.</p><p id="status">검사 시작...</p><img id="photo" alt="배너 진단 이미지"><p id="title"></p><pre id="log"></pre><button id="retry">다시 검사</button></main><script>
(()=>{'use strict';const base='https://ahwpjqtlncvvkrrhpctl.supabase.co',key='sb_publishable_0_HYdci54_Cep_-vja_A-g_tU9UO6O3';let items=[],idx=0,timer=null,cycles=0;
const $=id=>document.getElementById(id),log=msg=>{$('log').textContent+=new Date().toLocaleTimeString()+' '+msg+'\n';};
function show(){if(!items.length)return;const r=items[idx];$('photo').src=r.image_url;$('title').textContent=(idx+1)+' / '+items.length+' · '+(r.title||'');$('status').textContent='배너 '+(idx+1)+' / '+items.length+' · 자동 전환 '+cycles+'회';log('전환 '+(idx+1)+'번');idx=(idx+1)%items.length;}
$('photo').onload=()=>log('이미지 표시 성공');$('photo').onerror=()=>log('이미지 표시 실패: '+$('photo').src);
async function run(){if(timer)clearInterval(timer);items=[];idx=0;cycles=0;$('log').textContent='';log('진단 페이지 실행');log('화면 폭 '+innerWidth+'px, 화면 표시 '+document.visibilityState);try{const r=await fetch(base+'/rest/v1/home_content?select=section,position,title,body,image_url,published&section=eq.hero&published=eq.true&order=position.asc',{headers:{apikey:key,Authorization:'Bearer '+key},cache:'no-store'});log('데이터 응답 HTTP '+r.status);if(!r.ok)throw Error('HTTP '+r.status);const rows=await r.json();items=rows.filter(x=>/^https:\/\//i.test(x.image_url||''));log('공개 배너 수 '+items.length);if(!items.length){$('status').textContent='공개 배너가 없습니다';return;}show();timer=setInterval(()=>{cycles++;show();},5000);}catch(e){$('status').textContent='데이터 조회 실패';log('오류 '+e.message);}}
$('retry').addEventListener('click',run);run();})();
</script></body></html>
