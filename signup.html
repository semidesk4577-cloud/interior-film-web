<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입 | HOME FILM</title><link rel="stylesheet" href="member.css"></head><body><main class="wrap"><div class="brand"><a href="/">홈필름</a><small>HOME FILM</small></div><section class="panel"><h1>회원가입</h1><p>견적 문의를 이용하려면 이메일 인증이 필요합니다.</p><form id="signup"><label for="name">이름</label><input id="name" name="name" autocomplete="name" maxlength="60" required><label for="email">이메일 (로그인 ID)</label><input id="email" type="email" autocomplete="email" required><label for="password">비밀번호 (8자 이상)</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm">비밀번호 확인</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required><div class="check"><input id="agree" type="checkbox" required><label for="agree">개인정보 수집 및 이용에 동의합니다. (필수)<br><small>가입 목적: 계정 인증 및 상담 서비스 제공. 수집 항목: 이름·이메일. 보유 및 삭제 기준은 정식 개인정보처리방침에 따라 고지해야 합니다.</small></label></div><button type="submit">이메일 인증 후 가입</button></form><div id="status" class="msg" role="status" aria-live="polite"></div><div class="links"><a href="login.html">이미 계정이 있으신가요? 로그인</a><a href="/">홈으로</a></div></section><p class="foot">기존 홈페이지 및 관리자 시스템과 별도인 회원 인증 테스트 화면입니다.</p></main><script src="config.js"></script><script type="module" src="member.js"></script></body></html>
