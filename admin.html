<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOME FILM | 관리자</title><style>body{margin:0;background:#f7f4ef;color:#292722;font:15px/1.6 system-ui,'Noto Sans KR',sans-serif}main{max-width:1000px;margin:50px auto;padding:0 20px}h1{font-family:Georgia,serif}section{background:#fff;border:1px solid #e4ddd2;padding:25px;margin:20px 0}input,button,select{font:inherit;padding:10px;margin:6px 0;border:1px solid #bdb3a5;border-radius:3px}button{background:#332e28;color:white;cursor:pointer}button:disabled{opacity:.5}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:12px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}th{background:#f7f4ef}.tablewrap{overflow:auto}#msg{color:#79543a;white-space:pre-wrap}label{display:block}small{color:#716b62}@media(max-width:600px){main{margin:20px auto}section{padding:15px}}</style></head><body><main><h1>HOME FILM <small>관리자</small></h1><p>관리자 계정으로만 고객 문의를 조회할 수 있습니다.</p><section id="loginSection"><h2>관리자 로그인</h2><form id="loginForm"><label>이메일 <input id="email" type="email" autocomplete="username" required></label><label>비밀번호 <input id="password" type="password" autocomplete="current-password" required></label><button type="submit">로그인</button></form></section><section id="dashboard" hidden><button id="logout">로그아웃</button><button id="refresh">새로고침</button><h2>상담 문의 목록</h2><div class="tablewrap"><table><thead><tr><th>접수일</th><th>고객</th><th>연락처</th><th>지역 / 부위</th><th>문의 내용</th><th>처리 상태</th></tr></thead><tbody id="rows"></tbody></table></div></section><p id="msg" role="status"></p><p><a href="/">← 홈페이지로 돌아가기</a></p></main><script src="config.js"></script><script type="module" src="admin.js"></script></body></html>
