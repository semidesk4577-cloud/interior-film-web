<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOME FILM · 접수 관리</title><style>body{font:15px system-ui;background:#f6f2ed;color:#352a23;max-width:1000px;margin:35px auto;padding:15px}input,textarea,select,button{font:inherit;padding:10px;margin:5px 0;border:1px solid #cbbbad;border-radius:5px}input:not([type="checkbox"]){width:min(95%,440px)}textarea{width:95%;height:80px}button{background:#382c24;color:white;cursor:pointer}article{background:white;padding:20px;margin:16px 0;border:1px solid #ded3c8;border-radius:8px}small{color:#68584b}p{white-space:pre-wrap;overflow-wrap:anywhere}.approval{display:flex;align-items:center;gap:10px;padding:12px 14px;margin:12px 0;background:#f4eee7;border:1px solid #cbbbad;border-radius:7px;font-weight:700;cursor:pointer}.approval input{width:22px;height:22px;accent-color:#382c24;flex:none}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}.toolbar select{min-width:150px}.toolbar input{width:min(95%,280px)!important}.secondary{background:#6e5c4c}.tag{display:inline-block;padding:4px 8px;border-radius:5px;background:#eee5db;font-size:12px}.saved{color:#246a42}.err{color:#b33227}button:disabled{opacity:.5;cursor:wait}#status{font-weight:bold}</style></head><body><h1>HOME FILM · 질문/상담 관리</h1><p>기존 관리자 로그인 계정으로 접속합니다. 로그인하지 않았다면 관리자 로그인 페이지로 이동하세요.</p><p><a href="admin.html">관리자 로그인</a> · <button id="load" type="button">목록 새로고침</button> · <button id="logout" type="button" class="secondary">로그아웃</button></p><p id="status" role="status"></p><div class="toolbar"><label for="filter">목록 구분</label><select id="filter"><option value="all">전체 접수</option><option value="question">고객 질문</option><option value="consultation">시공 상담</option></select><label for="search">검색</label><input id="search" placeholder="이름, 제목, 내용, 연락처" autocomplete="off"><button id="export" type="button" class="secondary">현재 목록 CSV 저장</button><span id="counts"></span></div><main id="items"></main><script src="config.js"></script><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const cfg=window.HOMEFILM_CONFIG||{};
const db=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);
const API='https://homefilm-api-production.up.railway.app';const el=id=>document.getElementById(id);const status=el('status');const items=el('items');let cached=[];
function node(tag,value){const n=document.createElement(tag);if(value!==undefined)n.textContent=value;return n;}
async function call(path,opts={}){const {data:{session},error}=await db.auth.getSession();if(error||!session?.access_token)throw Error('로그인이 필요합니다. admin.html에서 로그인하세요.');const token=session.access_token;const r=await fetch(API+path,{...opts,headers:{Authorization:'Bearer '+token,...(opts.body?{'Content-Type':'application/json'}:{})}});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw Error('HTTP '+r.status+' · '+(j.code||'인증/서버 확인 필요'));return j;}
async function load(){status.textContent='불러오는 중...';try{const j=await call('/api/admin/moderation');cached=j.items;render();status.textContent='목록을 불러왔습니다.';}catch(e){status.textContent=e.message;}}function render(){items.replaceChildren();const q=cached.filter(x=>x.kind==='question').length;const c=cached.length-q;el('counts').textContent=`전체 ${cached.length}건 · 질문 ${q}건 · 상담 ${c}건`;const filter=el('filter').value;const term=el('search').value.trim().toLocaleLowerCase();const visible=cached.filter(x=>(filter==='all'||x.kind===filter)&&(!term||[x.author,x.title,x.body,x.phone].some(v=>String(v||'').toLocaleLowerCase().includes(term))));el('counts').textContent+=` · 표시 ${visible.length}건`;for(const x of visible){const a=node('article');a.append(node('h3',(x.kind==='question'?'질문':'시공 상담')+' · '+(x.title||'제목 없음')));a.append(node('small',x.created_at+' · '+x.author));a.append(node('p',x.body));if(x.phone)a.append(node('small','연락처: '+x.phone));const sel=node('select');for(const [v,label] of [['new','신규'],['in_progress','진행 중'],['closed','완료']]){const o=node('option',label);o.value=v;o.selected=x.status===v;sel.append(o);}a.append(node('div','처리 상태'));a.append(sel);let answer,pub;if(x.kind==='question'){a.append(node('div','관리자 답변'));answer=node('textarea');answer.value=x.answer||'';a.append(answer);const label=node('label');label.className='approval';pub=node('input');pub.type='checkbox';pub.checked=!!x.published;label.append(pub,node('span','고객 홈페이지에 질문·답변 공개 승인'));a.append(label);}const b=node('button','저장');b.onclick=async()=>{b.disabled=true;status.textContent='저장 중...';try{const body={status:sel.value};if(x.kind==='question'){body.answer=answer.value;body.published=pub.checked;}await call('/api/admin/moderation/'+encodeURIComponent(x.id),{method:'PATCH',body:JSON.stringify(body)});status.textContent='저장 완료';x.status=sel.value;if(x.kind==='question'){x.answer=answer.value;x.published=pub.checked;}let note=a.querySelector('.save-note');if(!note){note=node('small');note.className='save-note saved';a.append(note);}note.textContent=' ✓ 저장 완료';}catch(e){status.textContent=e.message;}finally{b.disabled=false;}};a.append(node('div'));a.append(b);items.append(a);}}el('load').onclick=load;el('logout').onclick=async()=>{await db.auth.signOut();cached=[];items.replaceChildren();status.textContent='로그아웃되었습니다.';location.href='admin.html';};db.auth.getSession().then(({data})=>{if(data?.session)load();else status.textContent='관리자 로그인이 필요합니다. 위의 관리자 로그인 링크를 누르세요.';}).catch(()=>{status.textContent='인증 확인 실패. 관리자 로그인 페이지에서 다시 로그인하세요.';});el('filter').onchange=render;el('search').oninput=render;
// Export only explicitly loaded records; prevent spreadsheet formula injection.
function safeCsv(v){let s=String(v??'').replace(/^[\s\uFEFF]*[=+@-]/u,m=>"'"+m);return '"'+s.replace(/"/g,'""')+'"';}
el('export').onclick=()=>{if(!cached.length){status.textContent='먼저 목록을 불러오세요.';return;}const filter=el('filter').value,term=el('search').value.trim().toLocaleLowerCase();const rows=cached.filter(x=>(filter==='all'||x.kind===filter)&&(!term||[x.author,x.title,x.body,x.phone].some(v=>String(v||'').toLocaleLowerCase().includes(term))));if(!rows.length){status.textContent='내보낼 항목이 없습니다.';return;}const head=['접수일','구분','작성자','제목','내용','연락처','상태','답변','공개승인'];const body=rows.map(x=>[x.created_at,x.kind==='question'?'질문':'시공 상담',x.author,x.title,x.body,x.phone,({new:'신규',in_progress:'진행 중',closed:'완료'})[x.status]||x.status,x.answer,x.published?'예':'아니오']);const csv='\uFEFF'+[head,...body].map(r=>r.map(safeCsv).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='HOMEFILM_접수목록_'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent=rows.length+'건을 CSV로 저장했습니다. 개인정보 파일은 안전하게 보관하세요.';};
</script></body></html>
