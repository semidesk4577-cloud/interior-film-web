<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOME FILM · 접수 관리</title><style>body{font:15px system-ui;background:#f6f2ed;color:#352a23;max-width:1000px;margin:35px auto;padding:15px}input,textarea,select,button{font:inherit;padding:10px;margin:5px 0;border:1px solid #cbbbad;border-radius:5px}input{width:min(95%,440px)}textarea{width:95%;height:80px}button{background:#382c24;color:white;cursor:pointer}article{background:white;padding:20px;margin:16px 0;border:1px solid #ded3c8;border-radius:8px}small{color:#68584b}p{white-space:pre-wrap;overflow-wrap:anywhere}#status{font-weight:bold}</style></head><body><h1>HOME FILM · 질문/상담 관리</h1><p>관리자 토큰은 이 페이지의 메모리에서만 사용하며 저장하지 않습니다. 공용 컴퓨터에서는 사용하지 마세요.</p><label>관리자 API 토큰 <input id="token" type="password" autocomplete="off"></label> <button id="load">목록 불러오기</button><p id="status" role="status"></p><main id="items"></main><script>
const API='https://homefilm-api-production.up.railway.app';const el=id=>document.getElementById(id);const status=el('status');const items=el('items');
function node(tag,value){const n=document.createElement(tag);if(value!==undefined)n.textContent=value;return n;}
async function call(path,opts={}){const token=el('token').value.trim();if(!token)throw Error('관리자 토큰을 입력하세요.');const r=await fetch(API+path,{...opts,headers:{Authorization:'Bearer '+token,...(opts.body?{'Content-Type':'application/json'}:{})}});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw Error('HTTP '+r.status+' · '+(j.code||'인증/서버 확인 필요'));return j;}
async function load(){status.textContent='불러오는 중...';items.replaceChildren();try{const j=await call('/api/admin/moderation');status.textContent='접수 '+j.items.length+'건';for(const x of j.items){const a=node('article');a.append(node('h3',(x.kind==='question'?'질문':'시공 상담')+' · '+(x.title||'제목 없음')));a.append(node('small',x.created_at+' · '+x.author));a.append(node('p',x.body));if(x.phone)a.append(node('small','연락처: '+x.phone));const sel=node('select');for(const [v,label] of [['new','신규'],['in_progress','진행 중'],['closed','완료']]){const o=node('option',label);o.value=v;o.selected=x.status===v;sel.append(o);}a.append(node('div','처리 상태'));a.append(sel);let answer,pub;if(x.kind==='question'){a.append(node('div','관리자 답변'));answer=node('textarea');answer.value=x.answer||'';a.append(answer);const label=node('label');pub=node('input');pub.type='checkbox';pub.checked=!!x.published;pub.style.width='auto';label.append(pub,node('span',' 공개 승인'));a.append(label);}const b=node('button','저장');b.onclick=async()=>{b.disabled=true;status.textContent='저장 중...';try{const body={status:sel.value};if(x.kind==='question'){body.answer=answer.value;body.published=pub.checked;}await call('/api/admin/moderation/'+encodeURIComponent(x.id),{method:'PATCH',body:JSON.stringify(body)});status.textContent='저장 완료';}catch(e){status.textContent=e.message;}finally{b.disabled=false;}};a.append(node('div'));a.append(b);items.append(a);}}catch(e){status.textContent=e.message;}}el('load').onclick=load;
</script></body></html>
