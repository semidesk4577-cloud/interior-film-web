<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOME FILM | 관리자 접수 관리</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#302c27;background:#f8f6f3}*{box-sizing:border-box}body{margin:0;font-size:15px;line-height:1.6}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}a{color:inherit;text-decoration:none}.top{background:#302b26;color:#fff;padding:19px max(22px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font:700 23px Georgia,serif;letter-spacing:.08em}.top small{font-size:12px;color:#d8c8b8}.top a{font-size:13px;color:#e9ded4}.layout{max-width:1160px;margin:0 auto;padding:30px 22px 65px}.heading{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap}.eyebrow{font-size:12px;letter-spacing:.16em;font-weight:700;color:#997e64}.heading h1{font-size:27px;letter-spacing:-.045em;margin:4px 0 6px}.muted{color:#756e68;font-size:14px;margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 16px;border-radius:8px;border:1px solid #d5c9bd;background:#fff;color:#3b3028;font-weight:650;white-space:nowrap}.btn.primary{background:#342c26;color:white;border-color:#342c26}.btn:hover,.save-button:hover{filter:brightness(.95)}#status{min-height:25px;color:#6e533b;font-size:13px;margin:16px 0 12px}.stat-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin:10px 0 27px}.stat-card{background:white;border:1px solid #e7ded5;border-radius:12px;padding:17px 16px;box-shadow:0 3px 12px rgba(48,38,28,.025)}.stat-card small{display:block;font-size:12px;color:#84786e}.stat-number{font-size:27px;font-weight:750;line-height:1.25;margin-top:7px}.panel{background:white;border:1px solid #e7ded5;border-radius:16px;padding:22px;box-shadow:0 8px 24px rgba(47,38,28,.035)}.panel-header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.panel h2{font-size:19px;margin:0}.toolbar{display:grid;grid-template-columns:150px 150px minmax(180px,1fr) auto;gap:10px;margin-bottom:13px}.toolbar label{display:block;font-size:12px;color:#7b7065;margin-bottom:4px}.toolbar select,.toolbar input{width:100%;height:43px;border:1px solid #d6cbc0;background:#fff;border-radius:8px;padding:8px 12px;outline-offset:2px}.toolbar button{height:43px;align-self:end}.summary-line{color:#83776d;font-size:12px;margin:8px 0 16px}.ticket{background:white;border:1px solid #e6ddd3;border-radius:12px;margin:10px 0;overflow:hidden}.ticket-details>summary{list-style:none;cursor:pointer}.ticket-details>summary::-webkit-details-marker{display:none}.ticket-summary{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:19px 20px}.ticket-summary:hover{background:#fcfaf8}.ticket-main{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;min-width:0}.ticket-title{font-size:16px;min-width:0;overflow-wrap:anywhere}.ticket-by{font-size:12px;color:#8a7d72;flex-basis:100%;padding-left:0}.type-tag,.state-tag{display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border-radius:6px;padding:4px 9px;white-space:nowrap}.type-tag.question{background:#eef1f7;color:#566a8c}.type-tag.consultation{background:#f5ece0;color:#88643d}.state-tag.new{background:#fff1df;color:#99622e}.state-tag.in_progress{background:#eaf1fa;color:#42658d}.state-tag.closed{background:#edf4eb;color:#3d7145}.ticket-side{display:flex;align-items:center;gap:15px;white-space:nowrap}.more{font-size:12px;color:#74685d}.more:after{content:'⌄';margin-left:7px}.ticket-details[open] .more:after{content:'⌃'}.ticket-body{border-top:1px solid #eee6de;background:#fdfcfb;padding:20px}.field-label{font-weight:700;font-size:13px;color:#65574b;margin:13px 0 7px}.ticket-content{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;border:1px solid #eee5dd;border-radius:8px;padding:14px;margin:0}.ticket-body select{border:1px solid #d6c7b8;border-radius:8px;padding:9px 12px;background:#fff;min-width:135px}.ticket-body textarea{display:block;width:100%;min-height:110px;resize:vertical;border:1px solid #d6c7b8;border-radius:8px;padding:13px;background:white}.ticket-body button{border:0;background:#665343;color:#fff;border-radius:7px;padding:8px 12px;margin:6px 0}.ticket-body .save-button{display:block;background:#342c26;padding:11px 25px;margin-top:16px}.approval{display:flex;align-items:center;gap:10px;padding:12px 14px;margin:14px 0;background:#f5f0e9;border:1px solid #e0d3c5;border-radius:8px;font-weight:700;cursor:pointer}.approval input{width:20px;height:20px;accent-color:#4e3d2e;flex:none}.saved{color:#287246}.empty{text-align:center;color:#8a7c70;padding:40px 10px}.footer{font-size:12px;color:#8d8075;margin-top:16px}.top-nav{display:flex;gap:14px;flex-wrap:wrap}@media(max-width:900px){.stat-grid{grid-template-columns:repeat(3,1fr)}.toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar .search-wrap{grid-column:1/-1}.toolbar button{grid-column:1/-1}}@media(max-width:600px){.top{padding:16px}.brand{font-size:19px}.layout{padding:22px 12px}.heading h1{font-size:23px}.stat-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.stat-card{padding:12px 10px}.stat-number{font-size:23px}.panel{padding:15px 12px}.toolbar{grid-template-columns:1fr 1fr;gap:8px}.ticket-summary{padding:15px 12px}.ticket-side{gap:7px}.ticket-body{padding:14px}.more{font-size:11px}}
</style></head><body>
<header class="top"><div><div class="brand">HOME FILM</div><small>ADMIN CONSOLE</small></div><nav class="top-nav"><a href="admin.html">관리자 홈</a><a href="content-admin.html">시공 사진</a><a href="index.html">홈페이지</a></nav></header>
<div class="layout"><div class="heading"><div><div class="eyebrow">CUSTOMER MANAGEMENT</div><h1>고객 접수 관리</h1><p class="muted">질문과 시공 상담을 한눈에 확인하고 처리하세요.</p></div><div class="actions"><button class="btn" id="load" type="button">↻ 새로고침</button><button class="btn" id="logout" type="button">로그아웃</button></div></div>
<p id="status" role="status" aria-live="polite"></p><div class="stat-grid" id="summary" aria-label="접수 현황"></div>
<section class="panel"><div class="panel-header"><h2>접수 목록</h2><button class="btn" id="export" type="button">CSV 다운로드</button></div>
<div class="toolbar"><div><label for="filter">접수 구분</label><select id="filter"><option value="all">전체 접수</option><option value="question">고객 질문</option><option value="consultation">시공 상담</option></select></div><div><label for="stateFilter">처리 상태</label><select id="stateFilter"><option value="all">전체 상태</option><option value="new">신규</option><option value="in_progress">진행 중</option><option value="closed">완료</option></select></div><div class="search-wrap"><label for="search">고객 검색</label><input id="search" placeholder="이름, 제목, 문의 내용, 연락처" autocomplete="off"></div></div><div class="summary-line" id="counts"></div><main id="items"></main></section>
<p class="footer">관리자 계정으로 로그인해야 접수 내역을 볼 수 있습니다. CSV 파일에는 고객 개인정보가 포함될 수 있으므로 안전하게 보관하세요.</p></div>
<script src="config.js"></script><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const cfg=window.HOMEFILM_CONFIG||{};
const db=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);
const API='https://homefilm-api-production.up.railway.app';const el=id=>document.getElementById(id);const status=el('status');const items=el('items');let cached=[];
function node(tag,value){const n=document.createElement(tag);if(value!==undefined)n.textContent=value;return n;}
async function call(path,opts={}){const {data:{session},error}=await db.auth.getSession();if(error||!session?.access_token)throw Error('로그인이 필요합니다. admin.html에서 로그인하세요.');const token=session.access_token;const r=await fetch(API+path,{...opts,headers:{Authorization:'Bearer '+token,...(opts.body?{'Content-Type':'application/json'}:{})}});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw Error('HTTP '+r.status+' · '+(j.code||'인증/서버 확인 필요'));return j;}
async function load(){status.textContent='불러오는 중...';try{const j=await call('/api/admin/moderation');cached=j.items;render();status.textContent='목록을 불러왔습니다.';}catch(e){status.textContent=e.message;}}function render(){items.replaceChildren();const q=cached.filter(x=>x.kind==='question').length;const c=cached.length-q;el('counts').textContent=`전체 ${cached.length}건 · 질문 ${q}건 · 상담 ${c}건`;const summary=el('summary');summary.replaceChildren();for(const [label,num] of [['전체 접수',cached.length],['질문',q],['시공 상담',c],['신규',cached.filter(x=>x.status==='new').length],['진행 중',cached.filter(x=>x.status==='in_progress').length],['완료',cached.filter(x=>x.status==='closed').length]]){const box=node('div');box.className='stat-card';const t=node('small',label),v=node('div',String(num));v.className='stat-number';box.append(t,v);summary.append(box);}const filter=el('filter').value;const stateFilter=el('stateFilter').value;const term=el('search').value.trim().toLocaleLowerCase();const visible=cached.filter(x=>(filter==='all'||x.kind===filter)&&(stateFilter==='all'||x.status===stateFilter)&&(!term||[x.author,x.title,x.body,x.phone].some(v=>String(v||'').toLocaleLowerCase().includes(term))));el('counts').textContent+=` · 표시 ${visible.length}건`;if(!visible.length){const empty=node('p','조건에 맞는 접수 내역이 없습니다.');empty.className='empty';items.append(empty);}for(const x of visible){const a=node('article');a.className='ticket';
const details=node('details');details.className='ticket-details';
const summaryRow=node('summary');summaryRow.className='ticket-summary';
const left=node('div');left.className='ticket-main';
const type=node('span',x.kind==='question'?'고객 질문':'시공 상담');type.className='type-tag '+(x.kind==='question'?'question':'consultation');
const title=node('strong',x.title|| (x.kind==='question'?'제목 없는 질문':'시공 상담 접수'));title.className='ticket-title';
const by=node('span',x.author+' · '+String(x.created_at||'').slice(0,10));by.className='ticket-by';
left.append(type,title,by);
const right=node('div');right.className='ticket-side';
const state=node('span',({new:'신규',in_progress:'진행 중',closed:'완료'})[x.status]||'접수');state.className='state-tag '+(x.status||'new');
const more=node('span','상세 보기');more.className='more';right.append(state,more);summaryRow.append(left,right);details.append(summaryRow);
const detailBody=node('div');detailBody.className='ticket-body';
const bodyLabel=node('div','접수 내용');bodyLabel.className='field-label';detailBody.append(bodyLabel);
const content=node('p',x.body);content.className='ticket-content';detailBody.append(content);a.append(details);if(x.phone){const phoneRow=node('div');phoneRow.append(node('small','연락처: '+x.phone+' '));const copy=node('button','연락처 복사');copy.type='button';copy.className='secondary';copy.style.cssText='padding:5px 8px;font-size:12px';copy.onclick=async()=>{try{await navigator.clipboard.writeText(x.phone);status.textContent='연락처를 복사했습니다.';}catch{status.textContent='브라우저에서 복사할 수 없습니다. 연락처를 직접 선택해 주세요.';}};phoneRow.append(copy);detailBody.append(phoneRow);}const sel=node('select');for(const [v,label] of [['new','신규'],['in_progress','진행 중'],['closed','완료']]){const o=node('option',label);o.value=v;o.selected=x.status===v;sel.append(o);}const stateLabel=node('div','처리 상태');stateLabel.className='field-label';detailBody.append(stateLabel);detailBody.append(sel);let answer,pub;if(x.kind==='question'){const answerLabel=node('div','관리자 답변');answerLabel.className='field-label';detailBody.append(answerLabel);answer=node('textarea');answer.value=x.answer||'';detailBody.append(answer);const label=node('label');label.className='approval';pub=node('input');pub.type='checkbox';pub.checked=!!x.published;label.append(pub,node('span','고객 홈페이지에 질문·답변 공개 승인'));detailBody.append(label);}const b=node('button','저장');b.onclick=async()=>{b.disabled=true;status.textContent='저장 중...';try{const body={status:sel.value};if(x.kind==='question'){body.answer=answer.value;body.published=pub.checked;}await call('/api/admin/moderation/'+encodeURIComponent(x.id),{method:'PATCH',body:JSON.stringify(body)});status.textContent='저장 완료';x.status=sel.value;state.textContent=({new:'신규',in_progress:'진행 중',closed:'완료'})[sel.value];state.className='state-tag '+sel.value;if(x.kind==='question'){x.answer=answer.value;x.published=pub.checked;}let note=a.querySelector('.save-note');if(!note){note=node('small');note.className='save-note saved';detailBody.append(note);}note.textContent=' ✓ 저장 완료';}catch(e){status.textContent=e.message;}finally{b.disabled=false;}};b.className='save-button';detailBody.append(b);details.append(detailBody);items.append(a);}}el('load').onclick=load;el('logout').onclick=async()=>{await db.auth.signOut();cached=[];items.replaceChildren();status.textContent='로그아웃되었습니다.';location.href='admin.html';};db.auth.getSession().then(({data})=>{if(data?.session)load();else status.textContent='관리자 로그인이 필요합니다. 위의 관리자 로그인 링크를 누르세요.';}).catch(()=>{status.textContent='인증 확인 실패. 관리자 로그인 페이지에서 다시 로그인하세요.';});el('filter').onchange=render;el('stateFilter').onchange=render;el('search').oninput=render;
// Export only explicitly loaded records; prevent spreadsheet formula injection.
function safeCsv(v){let s=String(v??'').replace(/^[\s\uFEFF]*[=+@-]/u,m=>"'"+m);return '"'+s.replace(/"/g,'""')+'"';}
el('export').onclick=()=>{if(!cached.length){status.textContent='먼저 목록을 불러오세요.';return;}const filter=el('filter').value,stateFilter=el('stateFilter').value,term=el('search').value.trim().toLocaleLowerCase();const rows=cached.filter(x=>(filter==='all'||x.kind===filter)&&(stateFilter==='all'||x.status===stateFilter)&&(!term||[x.author,x.title,x.body,x.phone].some(v=>String(v||'').toLocaleLowerCase().includes(term))));if(!rows.length){status.textContent='내보낼 항목이 없습니다.';return;}const head=['접수일','구분','작성자','제목','내용','연락처','상태','답변','공개승인'];const body=rows.map(x=>[x.created_at,x.kind==='question'?'질문':'시공 상담',x.author,x.title,x.body,x.phone,({new:'신규',in_progress:'진행 중',closed:'완료'})[x.status]||x.status,x.answer,x.published?'예':'아니오']);const csv='\uFEFF'+[head,...body].map(r=>r.map(safeCsv).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='HOMEFILM_INTAKES_'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent=rows.length+'건을 CSV로 저장했습니다. 개인정보 파일은 안전하게 보관하세요.';};
</script></body></html>
