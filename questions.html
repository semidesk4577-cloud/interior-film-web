<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>고객 질문 | HOME FILM</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f4ef;color:#302b26;font:15px/1.65 system-ui,sans-serif}header{background:#332b25;color:white;padding:20px max(20px,calc((100% - 1080px)/2))}header b{font:700 25px Georgia,serif;letter-spacing:.08em}header span{margin-left:15px;color:#d8c8b6}main{max-width:1080px;margin:auto;padding:28px 20px}section,.tile{background:#fff;border:1px solid #e7dfd5;border-radius:12px;padding:22px;margin-bottom:18px}h1{font-size:26px}h2{font-size:19px;margin-top:0}input,textarea,select,button{font:inherit;padding:10px;border:1px solid #c9bbae;border-radius:7px;max-width:100%}input,textarea,select{width:100%}textarea{min-height:100px}button{background:#3e332a;color:white;cursor:pointer}button:disabled{opacity:.5}label{display:block;margin:12px 0;font-weight:600}.muted{color:#766d64;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.tile img{width:100%;height:190px;object-fit:cover;border-radius:8px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.bar>*{flex:1}#msg{white-space:pre-wrap;color:#8a4c2b}a{color:inherit} [hidden]{display:none!important}</style><header><b>HOME FILM</b><span>고객 질문</span></header><main><p><a href="/">← 홈페이지</a>　<a href="/gallery.html">시공 사례</a></p><h1>궁금한 점을 남겨주세요</h1><section><p class="muted">전화번호, 주소 등 개인정보는 질문에 적지 마세요. 질문과 관리자 답변은 공개됩니다.</p><form id="ask"><label>작성자 이름 또는 별명<input name="author" maxlength="30" required></label><label>질문 제목<input name="title" maxlength="100" required></label><label>질문 내용<textarea name="body" maxlength="2000" required></textarea></label><button type="submit">질문 등록</button></form><p id="msg" role="status"></p></section><h2>질문과 답변</h2><div id="items"></div></main><script src="config.js"></script><script type="module" src="content.js"></script></html>
